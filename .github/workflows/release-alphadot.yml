name: Release AlphaDot APK

# Manual only. This workflow never publishes on push; a maintainer must run it
# and supply a version such as v1.0.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and attach AlphaDot APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version input
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version must look like v1.0.0"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK components
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(find "$SDK" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare release artifact
        id: prep
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi
          NAME="AlphaDot-${{ github.event.inputs.version }}-debug.apk"
          cp "$APK" "$NAME"
          python patcher/verify.py "$NAME"
          echo "ARTIFACT=$NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: AlphaDot ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: ${{ steps.prep.outputs.ARTIFACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
